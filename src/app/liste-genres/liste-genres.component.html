<div class="col-sm-4 col-md-4 col-lg-4 mb-4">
  <app-update-genre
    [genre]="updatedGen"
    [ajout]="ajout"
    (GenreUpdated)="genreUpdated($event)">
  </app-update-genre>

  @if (!ajout) {
    <button type="button" class="btn btn-secondary mt-2"
            (click)="ajout = true; updatedGen = { idGen: 0, nomGen: '' }">
      Nouveau genre
    </button>
  }
</div>

<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nom Genre</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (gen of genres; track gen.idGen) {
            <tr>
              <td>{{ gen.idGen }}</td>
              <td>{{ gen.nomGen }}</td>
              <td>
                <a class="btn btn-success" (click)="updategen(gen)">Editer</a>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
